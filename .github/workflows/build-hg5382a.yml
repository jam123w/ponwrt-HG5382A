name: Build PonWrt HG5382A

# =============================================================================
# 仅编译 FiberHome HG5382A (fiberhome_hg5382a, AN7581)
# - 定时自动同步上游 wuziwei/ponwrt-ZN504-HG5585F 的 master，有更新才编译
# - 支持手动触发、上传 Release
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload firmware to GitHub Releases'
        required: false
        default: true
        type: boolean
      cache_mode:
        description: '编译缓存模式 (使用缓存 / 重新编译 / 不使用缓存)'
        required: false
        default: '使用缓存'
        type: choice
        options:
          - '使用缓存'
          - '重新编译'
          - '不使用缓存'
  schedule:
    # 每天 UTC 21:00（北京时间次日 05:00）检查上游是否有更新
    - cron: '0 21 * * *'
  push:
    branches:
      - master
    paths:
      - 'configs/**'
      - 'files/**'
      - 'scripts/**'
      - 'target/**'
      - 'package/**'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 上游源仓库（跟随其 master 自动更新）
  UPSTREAM_REPO: wuziwei/ponwrt-ZN504-HG5585F
  UPSTREAM_BRANCH: master
  # 唯一编译的目标设备 profile
  TARGET_DEVICE: fiberhome_hg5382a
  CCACHE_COMPILERCHECK: '%compiler% -dumpmachine; %compiler% -dumpversion'
  CCACHE_MAXSIZE: 5G

jobs:
  sync-upstream:
    name: Sync upstream master
    runs-on: ubuntu-24.04
    outputs:
      updated: ${{ steps.sync.outputs.updated }}
    permissions:
      contents: write
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with upstream
        id: sync
        env:
          UPSTREAM_REPO: ${{ env.UPSTREAM_REPO }}
          UPSTREAM_BRANCH: ${{ env.UPSTREAM_BRANCH }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" || true
          git fetch upstream "${UPSTREAM_BRANCH}" --tags

          UPSTREAM_SHA="$(git rev-parse upstream/${UPSTREAM_BRANCH})"
          FORK_SHA="$(git rev-parse HEAD)"
          echo "upstream=${UPSTREAM_SHA}"
          echo "fork=${FORK_SHA}"

          if [ "${UPSTREAM_SHA}" = "${FORK_SHA}" ]; then
            echo "updated=false" >> "${GITHUB_OUTPUT}"
            echo "Fork already matches upstream, nothing to sync."
            exit 0
          fi

          # 合并上游；冲突时 .github/workflows 下保留本 fork 自己的配置
          git merge --no-edit -X ours "upstream/${UPSTREAM_BRANCH}" || {
            echo "::warning::Auto-merge had conflicts; keeping fork workflow files."
            git checkout --ours .github/workflows || true
            git add -A
            git commit --no-edit || true
          }

          # 由 GITHUB_TOKEN 发起的 push 不会再次触发 Actions，天然避免循环
          git push origin HEAD:master
          echo "updated=true" >> "${GITHUB_OUTPUT}"

  build:
    name: Build HG5382A
    needs: sync-upstream
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler dwarves flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full pahole patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-hg5382a-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-hg5382a-

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare custom packages
        run: |
          bash ./scripts/customize.sh

      - name: Restore compiler ccache
        if: (github.event.inputs.cache_mode || '使用缓存') != '不使用缓存'
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ponwrt-ccache-hg5382a-${{ hashFiles('configs/*.config') }}-${{ github.sha }}
          restore-keys: |
            ponwrt-ccache-hg5382a-${{ hashFiles('configs/*.config') }}-
            ponwrt-ccache-hg5382a-

      - name: Configure for HG5382A only
        env:
          TARGET_DEVICE: ${{ env.TARGET_DEVICE }}
        run: |
          set -euo pipefail
          ./scripts/kconfig.pl + \
            configs/an7581.config \
            configs/release.config > .config

          # 关闭 an7581 subtarget 下除 HG5382A 之外的全部机型
          sed -i -E '/^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_/d' .config
          sed -i -E '/^CONFIG_TARGET_DEVICE_PACKAGES_airoha_an7581_DEVICE_/d' .config
          sed -i -E '/^CONFIG_TARGET_airoha_an7581_DEVICE_/d' .config
          printf 'CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_%s=y\n' "${TARGET_DEVICE}" >> .config
          printf 'CONFIG_TARGET_DEVICE_PACKAGES_airoha_an7581_DEVICE_%s=""\n' "${TARGET_DEVICE}" >> .config

          # 内核调试信息 / BTF（沿用上游设置）
          sed -i '/^CONFIG_KERNEL_DEBUG_INFO_REDUCED=/d' .config
          printf 'CONFIG_KERNEL_DEBUG_INFO=y\n# CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set\nCONFIG_KERNEL_DEBUG_INFO_BTF=y\nCONFIG_KERNEL_DEBUG_INFO_BTF_MODULES=y\nCONFIG_KERNEL_MODULE_ALLOW_BTF_MISMATCH=y\nCONFIG_KERNEL_KPROBES=y\nCONFIG_KERNEL_BPF_EVENTS=y\n' >> .config

          if [ "${{ github.event.inputs.cache_mode || '使用缓存' }}" != "不使用缓存" ]; then
            sed -i '/^CONFIG_DEVEL=/d; /^CONFIG_CCACHE=/d' .config
            printf 'CONFIG_DEVEL=y\nCONFIG_CCACHE=y\n' >> .config
          fi

          make defconfig

          # 校验：最终只应保留 HG5382A 一个设备
          echo "=== Selected target devices ==="
          grep -E '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_' .config || true
          if ! grep -q "^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_${TARGET_DEVICE}=y" .config; then
            echo "::error::Target device ${TARGET_DEVICE} was not selected in .config"
            exit 1
          fi

      - name: Download package sources
        run: make download -j"$(nproc)"

      - name: Compile firmware
        run: |
          [ -x staging_dir/host/bin/ccache ] && CCACHE_DIR=$PWD/.ccache staging_dir/host/bin/ccache -z || true
          make -j"$(nproc)" || make -j1 V=s

      - name: Save compiler ccache
        if: always() && ((github.event.inputs.cache_mode || '使用缓存') != '不使用缓存')
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ponwrt-ccache-hg5382a-${{ hashFiles('configs/*.config') }}-${{ github.sha }}

      - name: Show compiler cache statistics
        if: always() && ((github.event.inputs.cache_mode || '使用缓存') != '不使用缓存')
        run: |
          [ -x staging_dir/host/bin/ccache ] && CCACHE_DIR=$PWD/.ccache staging_dir/host/bin/ccache -s || true

      - name: Organize output files
        env:
          TARGET_DEVICE: ${{ env.TARGET_DEVICE }}
        run: |
          mkdir -p output
          # 只收集 HG5382A 的 sysupgrade / recovery / manifest，其余机型固件一律丢弃
          find bin/targets/airoha/an7581/ -type f \
            -name "*${TARGET_DEVICE}*" \
            \( -name "*sysupgrade.itb" -o -name "*recovery.itb" -o -name "*manifest" \) \
            -exec cp {} output/ \;
          cd output
          for file in $(ls * 2>/dev/null); do
            [ -f "${file}" ] && sha256sum "${file}" > "${file}.sha256"
          done
          echo "=== Generated Firmware Artifacts ==="
          ls -lh
          echo "FIRMWARE_DIR=$PWD" >> "${GITHUB_ENV}"

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PonWrt-HG5382A-firmware
          path: output/*
          retention-days: 14

      - name: Generate release tag
        id: tag
        if: github.event.inputs.upload_release != 'false'
        run: |
          echo "release_tag=v$(date +'%Y.%m.%d-%H%M')" >> "${GITHUB_OUTPUT}"

      - name: Upload firmware to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event.inputs.upload_release != 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: PonWrt HG5382A 固件 (${{ steps.tag.outputs.release_tag }})
          body: |
            ## HG5382A 专属构建

            - 设备：FiberHome HG5382A（`fiberhome_hg5382a`，AN7581）
            - 跟随上游 `wuziwei/ponwrt-ZN504-HG5585F` master 自动同步并编译
            - 仅包含本机型 sysupgrade / recovery 固件及校验值
          files: output/*
