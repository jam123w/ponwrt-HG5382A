name: Build PonWrt HG5382A

# =============================================================================
# 仅编译 FiberHome HG5382A (fiberhome_hg5382a, AN7581)
# - 定时自动同步上游 wuziwei/ponwrt-ZN504-HG5585F 的 master，有更新才编译
# - 支持手动触发、上传 Release
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload firmware to GitHub Releases'
        required: false
        default: true
        type: boolean
      cache_mode:
        description: '编译缓存模式 (使用缓存 / 重新编译 / 不使用缓存)'
        required: false
        default: '使用缓存'
        type: choice
        options:
          - '使用缓存'
          - '重新编译'
          - '不使用缓存'
  schedule:
    # 每 6 小时检查一次上游（UTC 0/6/12/18 → 北京 08:00 / 14:00 / 20:00 / 02:00）
    # 检查本身只跑 sync 任务（几十秒）；只有上游确有新提交时才会进入编译
    - cron: '0 */6 * * *'
  # 注意：push 触发已按需求关闭，修改文件后不会自动编译；
  # 需要出包请在 Actions 页面手动 Run workflow。

concurrency:
  # 手动触发 / 定时各自成组，避免互相抢线取消正在跑的构建
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  # 上游源仓库（跟随其 master 自动更新）
  UPSTREAM_REPO: wuziwei/ponwrt-ZN504-HG5585F
  UPSTREAM_BRANCH: master
  # 唯一编译的目标设备 profile
  TARGET_DEVICE: fiberhome_hg5382a
  CCACHE_COMPILERCHECK: '%compiler% -dumpmachine; %compiler% -dumpversion'
  # ccache 上限 5G：GitHub Actions 单仓库缓存总额度 10G，
  # 给 ccache 10G 会把 dl 下载缓存挤掉，反而每次重下源码
  CCACHE_MAXSIZE: 5G

jobs:
  sync-upstream:
    name: Sync upstream master
    runs-on: ubuntu-24.04
    outputs:
      updated: ${{ steps.sync.outputs.updated }}
      changelog: ${{ steps.sync.outputs.changelog }}
    permissions:
      contents: write
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with upstream
        id: sync
        env:
          UPSTREAM_REPO: ${{ env.UPSTREAM_REPO }}
          UPSTREAM_BRANCH: ${{ env.UPSTREAM_BRANCH }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" || true
          git fetch upstream "${UPSTREAM_BRANCH}" --tags

          UPSTREAM_SHA="$(git rev-parse upstream/${UPSTREAM_BRANCH})"
          OLD_SHA="$(git rev-parse HEAD)"
          echo "upstream=${UPSTREAM_SHA}"
          echo "fork=${OLD_SHA}"

          # 输出多行变更日志到 GITHUB_OUTPUT，供 Release 说明引用
          emit_changelog() {
            printf 'changelog<<__CHANGELOG_EOF__\n%s\n__CHANGELOG_EOF__\n' "$1" >> "${GITHUB_OUTPUT}"
          }

          # 注意：fork 内带有本仓库的 workflow 提交，且同步会产生合并提交，
          # HEAD 的 SHA 永远不等于上游 HEAD，不能用 SHA 相等判断“是否有更新”，
          # 否则每天定时都会误判成有新版本，白跑一轮完整编译。
          # 正确做法：看上游 HEAD 相对 fork 还领先多少个提交。
          AHEAD_COUNT="$(git rev-list --count "HEAD..upstream/${UPSTREAM_BRANCH}")"
          echo "upstream_ahead=${AHEAD_COUNT}"
          if [ "${AHEAD_COUNT}" -eq 0 ]; then
            echo "updated=false" >> "${GITHUB_OUTPUT}"
            emit_changelog "- 上游 master 无新提交"
            echo "Upstream has no new commits; nothing to sync."
            exit 0
          fi

          # 合并上游；提交信息带 [skip ci]，避免这次推送再触发一轮重复构建
          git merge --no-edit -m "chore: sync upstream ${UPSTREAM_BRANCH} [skip ci]" -X ours "upstream/${UPSTREAM_BRANCH}" || {
            echo "::warning::Auto-merge had conflicts; keeping fork workflow files."
            git checkout --ours .github/workflows || true
            git add -A
            git commit --no-edit -m "chore: sync upstream ${UPSTREAM_BRANCH} (conflicts resolved) [skip ci]" || true
          }

          # 收集本次同步带进来的上游提交，供 Release 说明使用
          NEW_SHA="$(git rev-parse HEAD)"
          COMMIT_COUNT="$(git rev-list --no-merges --count "${OLD_SHA}..${NEW_SHA}" 2>/dev/null || echo 0)"
          LOG="$(git log --no-merges --reverse --pretty=format:'- %s (%h)' "${OLD_SHA}..${NEW_SHA}" 2>/dev/null | head -n 30 || true)"
          if [ -z "${LOG}" ]; then
            LOG="- 上游本次仅更新了合并提交，无独立变更条目"
          elif [ "${COMMIT_COUNT}" -gt 30 ] 2>/dev/null; then
            LOG="${LOG}"$'\n'"- …其余 $((COMMIT_COUNT - 30)) 条已省略，完整记录见上游仓库提交历史"
          fi
          emit_changelog "${LOG}"

          # 由 GITHUB_TOKEN 发起的 push 不会再次触发 Actions，天然避免循环
          git push origin HEAD:master
          echo "updated=true" >> "${GITHUB_OUTPUT}"

  build:
    name: Build HG5382A
    needs: sync-upstream
    # 手动触发无条件编译；定时触发仅在上游确实有更新时才编译
    if: github.event_name == 'workflow_dispatch' || needs.sync-upstream.outputs.updated == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler dwarves flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full pahole patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-hg5382a-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-hg5382a-

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare custom packages
        run: |
          bash ./scripts/customize.sh

      - name: Add luci-theme-7dollar
        run: |
          set -euo pipefail
          # 7Dollar 不在上游 feeds 里，构建前克隆到 package/ 让 buildroot 扫描到
          # 该包 Makefile 依赖 $(TOPDIR)/feeds/luci/luci.mk，feeds 已在前面安装完毕
          rm -rf package/luci-theme-7dollar
          git clone --depth 1 https://github.com/itsmaiGe/luci-theme-7dollar.git package/luci-theme-7dollar
          test -f package/luci-theme-7dollar/Makefile || { echo "::error::7Dollar Makefile missing after clone"; exit 1; }
          # 关键修补：luci.mk 里 LUCI_MINIFY_UT 默认为 1，而 7Dollar 自带 ucode/template，
          # 会触发两件对本固件有害的事：
          #   1) 给包写入 EXTRA_DEPENDS "ucode (>=2026.02.27)"，本固件 ucode 低于该门槛，
          #      包安装进 rootfs 时依赖无法满足 -> "ERROR: package/luci-theme-7dollar failed to build"
          #   2) 用 host ucode 预编译 ucode/template 下的模板，host 与 target 字节码格式不一致时，
          #      设备上会直接拒绝加载模板，主题白屏
          # 7Dollar 自己已经预编译/自带页面框架，关掉模板预编译即可，对其它包零影响
          if grep -q '^LUCI_MINIFY_UT' package/luci-theme-7dollar/Makefile; then
            sed -i 's/^LUCI_MINIFY_UT.*/LUCI_MINIFY_UT:=0/' package/luci-theme-7dollar/Makefile
          else
            sed -i '/^LUCI_MINIFY_JS/a LUCI_MINIFY_UT:=0' package/luci-theme-7dollar/Makefile
          fi
          grep -q '^LUCI_MINIFY_UT:=0' package/luci-theme-7dollar/Makefile || { echo "::error::failed to disable LUCI_MINIFY_UT for 7Dollar"; exit 1; }
          grep -n 'LUCI_MINIFY' package/luci-theme-7dollar/Makefile
          grep -m1 '^PKG_NAME:=' package/luci-theme-7dollar/Makefile
          grep -m1 '^PKG_VERSION:=' package/luci-theme-7dollar/Makefile
          ls package/luci-theme-7dollar/htdocs/luci-static/ 2>/dev/null || true

      - name: Restore compiler ccache
        if: (github.event.inputs.cache_mode || '使用缓存') != '不使用缓存'
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ponwrt-ccache-hg5382a-${{ hashFiles('configs/*.config') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ponwrt-ccache-hg5382a-${{ hashFiles('configs/*.config') }}-
            ponwrt-ccache-hg5382a-

      - name: Configure for HG5382A only
        env:
          TARGET_DEVICE: ${{ env.TARGET_DEVICE }}
        run: |
          set -euo pipefail
          ./scripts/kconfig.pl + \
            configs/an7581.config \
            configs/release.config > .config

          # 关闭 an7581 subtarget 下除 HG5382A 之外的全部机型
          sed -i -E '/^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_/d' .config
          sed -i -E '/^CONFIG_TARGET_DEVICE_PACKAGES_airoha_an7581_DEVICE_/d' .config
          sed -i -E '/^CONFIG_TARGET_airoha_an7581_DEVICE_/d' .config
          printf 'CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_%s=y\n' "${TARGET_DEVICE}" >> .config
          printf 'CONFIG_TARGET_DEVICE_PACKAGES_airoha_an7581_DEVICE_%s=""\n' "${TARGET_DEVICE}" >> .config

          # 内核调试信息：保留 DEBUG_INFO（panic 时能定位文件行号）
          # BTF / BPF_EVENTS 仅供 eBPF（honk）使用，透明代理移除后一律关闭
          sed -i -E '/^CONFIG_KERNEL_(DEBUG_INFO|DEBUG_INFO_BTF|DEBUG_INFO_BTF_MODULES|DEBUG_INFO_REDUCED|MODULE_ALLOW_BTF_MISMATCH|BPF_EVENTS)=/d' .config
          printf 'CONFIG_KERNEL_DEBUG_INFO=y\n# CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set\n# CONFIG_KERNEL_DEBUG_INFO_BTF is not set\n# CONFIG_KERNEL_DEBUG_INFO_BTF_MODULES is not set\n# CONFIG_KERNEL_MODULE_ALLOW_BTF_MISMATCH is not set\n# CONFIG_KERNEL_BPF_EVENTS is not set\nCONFIG_KERNEL_KPROBES=y\n' >> .config

          # HG5382A 无 Wi-Fi、无 USB 口：剔除无线与 USB 相关包以减小固件体积
          # 注意：ext4/f2fs/macvlan/pciutils/libiwinfo 保留，交由 defconfig 按依赖裁决
          # 剔除清单：注释必须写在这里（变量外部），写进 STRIP_PACKAGES 内会被当作包名分词处理
          #   tailscale 三件套须一起剔，否则 luci-app-tailscale-community 的依赖会把 tailscale 拉回
          #   yq 仅为 Nikki/脚本预留，源码 files/ 零调用
          #   honk 整套（核心 + LuCI + i18n + dae 库 + geo 数据）及其 nft/tproxy/queue 依赖
          #   bpftool / kmod-sched-bpf 随 honk 移除
          #   kmod-tun / kmod-inet-diag / kmod-veth / kmod-dummy 刻意保留（VPN 与 ss 诊断需要）
          #   主题只保留 Argon（an7581.config 默认 y），footstrap / bootstrap 一并剔除
          STRIP_PACKAGES="
            wpad-openssl
            kmod-cfg80211
            kmod-mac80211
            kmod-mt7915e
            kmod-mt7916-firmware
            wireless-regdb
            iw
            iwinfo
            rpcd-mod-iwinfo
            kmod-usb-core
            kmod-usb3
            kmod-usb-storage
            kmod-usb-storage-uas
            kmod-usb-xhci-hcd
            kmod-usb-xhci-mtk
            kmod-fs-vfat
            kmod-fs-exfat
            kmod-fs-ntfs3
            usbutils
            tailscale
            luci-app-tailscale-community
            luci-i18n-tailscale-community-zh-cn
            yq
            honk
            luci-app-honk
            luci-i18n-honk-zh-cn
            luci-lib-daeuniverse
            luci-i18n-daeuniverse-zh-cn
            v2ray-geoip
            v2ray-geosite
            kmod-nft-tproxy
            kmod-nft-socket
            kmod-nft-queue
            kmod-nfnetlink-queue
            bpftool
            kmod-sched-bpf
            # ttyd：上游打包 ttyd 1.7.7 与 libwebsockets 5.1 不兼容，
            # 二进制在但一启动就 lws_context_destroy 退出，留着只是个坏菜单
            luci-app-ttyd
            luci-i18n-ttyd-zh-cn
            ttyd
            luci-theme-footstrap
            luci-theme-bootstrap
          "
          for p in ${STRIP_PACKAGES}; do
            sed -i "/^CONFIG_PACKAGE_${p}=/d" .config
            printf '# CONFIG_PACKAGE_%s is not set\n' "${p}" >> .config
          done
          sed -i '/^CONFIG_MAC80211_DEBUGFS=/d; /^CONFIG_MAC80211_MESH=/d' .config
          printf '# CONFIG_MAC80211_DEBUGFS is not set\n# CONFIG_MAC80211_MESH is not set\n' >> .config

          # LuCI 只保留简体中文：语言选择只留 zh_Hans，翻译包只留 -zh-cn
          sed -i -E '/^CONFIG_LUCI_LANG_/d' .config
          printf 'CONFIG_LUCI_LANG_zh_Hans=y\n' >> .config
          sed -i -E '/^CONFIG_PACKAGE_luci-i18n-/ { /-zh-cn=/!d }' .config

          # 预装 UPnP：miniupnpd 的 nftables 后端 + LuCI 管理页
          # 包默认只是装上，服务是否启停由 files/etc/uci-defaults/99-ponwrt-upnp 决定
          sed -i -E '/^CONFIG_PACKAGE_(miniupnpd|luci-app-upnp)/d' .config
          printf 'CONFIG_PACKAGE_miniupnpd-nftables=y\nCONFIG_PACKAGE_luci-app-upnp=y\n' >> .config

          # 内置 7Dollar 主题（源码在上一 step 克隆到 package/）
          printf 'CONFIG_PACKAGE_luci-theme-7dollar=y\n' >> .config

          if [ "${{ github.event.inputs.cache_mode || '使用缓存' }}" != "不使用缓存" ]; then
            sed -i '/^CONFIG_DEVEL=/d; /^CONFIG_CCACHE=/d' .config
            printf 'CONFIG_DEVEL=y\nCONFIG_CCACHE=y\n' >> .config
          fi

          make defconfig

          # 校验：最终只应保留 HG5382A 一个设备
          echo "=== Selected target devices ==="
          grep -E '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_' .config || true
          if ! grep -q "^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_${TARGET_DEVICE}=y" .config; then
            echo "::error::Target device ${TARGET_DEVICE} was not selected in .config"
            exit 1
          fi

          echo "=== Stripped packages final state (wireless/USB/tailscale/yq) ==="
          for p in ${STRIP_PACKAGES}; do
            if grep -q "^CONFIG_PACKAGE_${p}=y" .config; then
              echo "  WARN ${p} still enabled (pulled back by dependency)"
            else
              echo "  OK   ${p}: disabled"
            fi
          done

      - name: Clean removed LuCI apps (honk / ttyd) and legacy whitelist
        run: |
          set -euo pipefail

          # 包层面已在 STRIP_PACKAGES 中剔除；这里补三件必须一起做的事：
          # 1) 删掉仓库 files/ 下手写的 LuCI 菜单入口、ACL 与前端视图
          # 2) 从 files/etc/sysupgrade.conf 剔除对应路径，
          #    否则 sysupgrade 会把旧系统的入口文件原样搬回来，菜单照旧出现
          # 3) 校验 menu.d，确保不再声明这些入口
          #    ttyd 上游 1.7.7 与 libwebsockets 5.1 不兼容（启动即退出），
          #    决定不再提供网页终端，日常运维统一走 SSH（dropbear 内置）
          rm -f  files/usr/share/luci/menu.d/luci-app-honk.json
          rm -f  files/usr/share/rpcd/acl.d/luci-app-honk.json
          rm -rf files/www/luci-static/resources/view/honk
          rm -rf files/www/luci-static/resources/honk
          rm -f  files/etc/config/honk
          rm -f  files/usr/share/luci/menu.d/luci-app-ttyd.json
          rm -rf files/www/luci-static/resources/view/ttyd
          rm -f  files/etc/config/ttyd

          # 上游 scripts/customize.sh 会 git clone footstrap 源码到 package/，
          # 既然不打包该主题，顺手删掉省一轮编译时间
          rm -rf package/luci-theme-footstrap

          if [ -f files/etc/sysupgrade.conf ]; then
            grep -v -E '^(/usr/bin/honk|/usr/bin/honk-core|/usr/bin/honk-install|/usr/share/luci/menu.d/luci-app-honk.json|/usr/share/rpcd/acl.d/luci-app-honk.json|/www/luci-static/resources/view/honk|/www/luci-static/resources/honk|/etc/honk|/etc/config/honk|/usr/share/luci/menu.d/luci-app-ttyd.json|/www/luci-static/resources/view/ttyd|/etc/config/ttyd)$' \
              files/etc/sysupgrade.conf > /tmp/sysupgrade.conf.new || true
            mv /tmp/sysupgrade.conf.new files/etc/sysupgrade.conf
          fi

          echo "=== remaining honk/ttyd paths under files/ ==="
          find files \( -ipath '*honk*' -o -ipath '*ttyd*' \) 2>/dev/null || true

          for entry in 'admin/services/honk' 'admin/services/ttyd'; do
            if grep -rq "${entry}" files/usr/share/luci/menu.d/ 2>/dev/null; then
              echo "::error::Menu entry still present: ${entry}"
              exit 1
            fi
          done
          echo "OK: honk/ttyd menu entries stripped; SSH (dropbear) remains the only shell access"

      - name: Stage uci-defaults (UPnP + 7Dollar theme)
        run: |
          set -euo pipefail
          mkdir -p files/etc/uci-defaults
          printf '%s\n' \
            '#!/bin/sh' \
            '# 首次开机自动启用 UPnP（/etc/config/upnpd 默认 enabled=0）' \
            '[ -f /etc/config/upnpd ] || exit 0' \
            "uci -q set upnpd.config.enabled='1'" \
            'uci -q commit upnpd' \
            'exit 0' \
            > files/etc/uci-defaults/99-ponwrt-upnp
          chmod +x files/etc/uci-defaults/99-ponwrt-upnp

          # 7Dollar 作为默认主题；Argon 仍保留在固件里，可随时切回
          printf '%s\n' \
            '#!/bin/sh' \
            '# 默认主题 7Dollar（luci-static/7dollar）' \
            "[ -f /etc/config/luci ] || touch /etc/config/luci" \
            "uci -q set luci.themes.7Dollar='/luci-static/7dollar'" \
            "uci -q set luci.main.mediaurlbase='/luci-static/7dollar'" \
            "uci -q set luci.main.theme='7dollar'" \
            'uci -q commit luci' \
            'exit 0' \
            > files/etc/uci-defaults/99-ponwrt-theme
          chmod +x files/etc/uci-defaults/99-ponwrt-theme

          echo "=== staged uci-defaults ==="
          for f in files/etc/uci-defaults/*; do echo "--- $f"; cat "$f"; done

      - name: Download package sources
        run: make download -j"$(nproc)"

      - name: Compile firmware
        run: |
          [ -x staging_dir/host/bin/ccache ] && CCACHE_DIR=$PWD/.ccache staging_dir/host/bin/ccache -z || true
          make -j"$(nproc)" || make -j1 V=s

      - name: Save compiler ccache
        if: always() && ((github.event.inputs.cache_mode || '使用缓存') != '不使用缓存')
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ponwrt-ccache-hg5382a-${{ hashFiles('configs/*.config') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Show compiler cache statistics
        if: always() && ((github.event.inputs.cache_mode || '使用缓存') != '不使用缓存')
        run: |
          [ -x staging_dir/host/bin/ccache ] && CCACHE_DIR=$PWD/.ccache staging_dir/host/bin/ccache -s || true

      - name: Organize output files
        env:
          TARGET_DEVICE: ${{ env.TARGET_DEVICE }}
        run: |
          mkdir -p output
          # 只收集 HG5382A 的 sysupgrade / recovery / manifest，其余机型固件一律丢弃
          find bin/targets/airoha/an7581/ -type f \
            -name "*${TARGET_DEVICE}*" \
            \( -name "*sysupgrade.itb" -o -name "*recovery.itb" -o -name "*manifest" \) \
            -exec cp {} output/ \;
          cd output
          for file in $(ls * 2>/dev/null); do
            [ -f "${file}" ] && sha256sum "${file}" > "${file}.sha256"
          done
          echo "=== Generated Firmware Artifacts ==="
          ls -lh
          echo "FIRMWARE_DIR=$PWD" >> "${GITHUB_ENV}"

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PonWrt-HG5382A-firmware
          path: output/*
          retention-days: 14

      - name: Generate release tag
        id: tag
        if: github.event.inputs.upload_release != 'false'
        run: |
          echo "release_tag=v$(date -u +'%Y.%m.%d-%H%M')" >> "${GITHUB_OUTPUT}"
          echo "build_time=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "${GITHUB_OUTPUT}"

      - name: Upload firmware to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event.inputs.upload_release != 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: PonWrt HG5382A 固件 (${{ steps.tag.outputs.release_tag }})
          body: |
            ## HG5382A 专属构建

            - 设备：FiberHome HG5382A（`fiberhome_hg5382a`，AN7581）
